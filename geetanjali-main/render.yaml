services:
  - type: web
    name: geetanjali-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://geetanjali-salon.web.app,https://geetanjali-salon.firebaseapp.com
      - key: PG_DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
